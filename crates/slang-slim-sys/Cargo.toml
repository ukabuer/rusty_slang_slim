[package]
name = "slang-slim-sys"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Raw FFI bindings for the focused slang-slim shader compiler"
links = "slang_slim"
build = "build.rs"
publish = false

[features]
default = []
native = []

[lib]
path = "src/lib.rs"

[build-dependencies]
fs2 = "0.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "3.4.0", default-features = false, features = ["rustls"] }
zip = { version = "6.0.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[package]
name = "slang-slim-sys"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
description = "Raw FFI bindings for the focused slang-slim shader compiler"
license = "MIT"
repository = "https://github.com/ukabuer/rusty_slang_slim"
readme = "../../README.md"
links = "slang_slim"
build = "build.rs"

[features]
default = ["native"]
native = []

[package.metadata.docs.rs]
no-default-features = true

[lib]
path = "src/lib.rs"

[build-dependencies]
fs2 = "0.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "3.4.0", default-features = false, features = ["rustls"] }
zip = { version = "6.0.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

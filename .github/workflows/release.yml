name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  checks:
    name: Validate Rust and both native targets
    uses: ./.github/workflows/native.yml
    with:
      release_tag: ${{ github.ref_name }}

  native-release:
    name: Publish missing native assets
    needs: checks
    if: needs.checks.outputs.publish_native == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: native-package-*
          path: build/packages
          merge-multiple: true

      - name: Verify and publish native packages
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.checks.outputs.native_version }}
        run: |
          set -euo pipefail
          archives=()
          for target in x86_64-pc-windows-msvc aarch64-linux-android; do
            archive="build/packages/slang-slim-native-v${VERSION}-${target}.zip"
            unzip -tqq "$archive"
            unzip -p "$archive" manifest.json |
              jq -e --arg version "$VERSION" --arg target "$target" \
                '.version == $version and .target == $target and .link.kind == "static"' >/dev/null
            archives+=("$archive")
          done

          # Stage both archives before publishing so retries can resume the upload.
          releases="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[].tag_name')"
          if ! grep -Fxq -- "$RELEASE_TAG" <<< "$releases"; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --draft
          fi
          release="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets,isDraft)"
          assets="$(jq -r '.assets[].name' <<< "$release")"
          for archive in "${archives[@]}"; do
            if ! grep -Fxq -- "${archive##*/}" <<< "$assets"; then
              gh release upload "$RELEASE_TAG" "$archive" --repo "$GITHUB_REPOSITORY"
            fi
          done
          if jq -e '.isDraft' <<< "$release" >/dev/null; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          fi

  publish-sys:
    name: Publish slang-slim-sys
    needs: [checks, native-release]
    if: >-
      !cancelled() && needs.checks.result == 'success' &&
      (needs.native-release.result == 'success' ||
       (needs.native-release.result == 'skipped' && needs.checks.outputs.publish_native == 'false'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Check whether sys is already published
        id: registry
        run: python3 scripts/plan-release.py --check-crate slang-slim-sys --tag "$RELEASE_TAG"
      - uses: dtolnay/rust-toolchain@1.85.0
        if: steps.registry.outputs.publish == 'true'
      - name: Obtain temporary crates.io credential
        if: steps.registry.outputs.publish == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish sys crate
        if: steps.registry.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p slang-slim-sys --registry crates-io --no-default-features

  publish-safe:
    name: Publish slang-slim
    needs: publish-sys
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Check whether slang-slim is already published
        id: registry
        run: python3 scripts/plan-release.py --check-crate slang-slim --tag "$RELEASE_TAG"
      - uses: dtolnay/rust-toolchain@1.85.0
        if: steps.registry.outputs.publish == 'true'
      - name: Obtain temporary crates.io credential
        if: steps.registry.outputs.publish == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish safe crate
        if: steps.registry.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p slang-slim --registry crates-io --no-default-features
